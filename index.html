function renderHall(){let days=Math.max(0,daysBetween(data.started,today()));let left=Math.max(0,daysBetween(today(),data.anniversary));let photos=data.memories.filter(m=>m.photo).slice().sort(()=>Math.random()-.5).slice(0,4);let frames=Array.from({length:4},(_,i)=>{let m=photos[i];return `<div class="photo-frame">${m?`<img src="${m.photo}" alt="思い出の写真"><span class="hide">${esc(m.title)}</span>`:`<div class="photo-placeholder">✧<br>ふたりの思い出を<br>額縁に飾ろう</div>`}</div>`}).join('');let plans=data.plans.filter(p=>p.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,2);return `${header('玄関ホール','扉の向こうは、ふたりだけの世界','🏡 Welcome home')}<div class="content"><div class="hallgrid"><div class="hallleft">${panel('✧ OUR MEMORIES',`<div class="frames">${frames}</div><div class="muted" style="margin-top:7px">星の図書館に写真を飾ると、ここに現れるよ。</div>`,'')}<div class="grid2" style="flex:0 0 auto">${panel('♡ ふたりの日々',`<div class="stat">${days}<span style="font-size:13px"> 日</span></div><div class="statlabel">一緒に歩んできた日々</div>`)}${panel('✧ 次の記念日',`<div class="stat">${left}<span style="font-size:13px"> 日</span></div><div class="statlabel">${esc(dateLabel(data.anniversary))} まで</div>`)}</div></div><div class="hallright">${panel('📅 これからの約束',`${plans.length?plans.map(p=>`<div class="message"><div class="meta">${esc(dateLabel(p.date))}</div>${esc(p.title)}</div>`).join(''):'<div class="muted">まだ予定はないみたい。<br>新しい約束をつくろう。</div>'}<button class="btn ghost" data-action="goto-calendar" style="margin-top:8px">カレンダーを開く →</button>`,'')} ${panel('💌 小さなお知らせ',`<div class="muted">${data.letters.filter(l=>l.to==='both'&&!l.read).length?'届いた手紙が待っているよ。':'今日も、ふたりの家へおかえり。'}</div><button class="btn" data-action="check-letter" style="margin-top:8px">手紙をたしかめる ✨</button>`,'')}</div></div></div><div class="room-art">⌂</div>`}
function renderCalendar(){let d=new Date(selectedDate+'T12:00:00'),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();let marked=new Set([...data.memories.map(m=>m.date),...data.plans.map(p=>p.date)]);return `<div class="row" style="justify-content:space-between;margin-bottom:7px"><button class="btn ghost" data-action="month-prev">‹</button><b style="font-size:12px">${year}年 ${month+1}月</b><button class="btn ghost" data-action="month-next">›</button></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="muted" style="text-align:center;font-size:10px">${x}</div>`).join('')}${Array.from({length:first},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let n=i+1,key=`${year}-${String(month+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;return `<button class="day ${selectedDate===key?'selected':''} ${marked.has(key)?'marked':''}" data-date="${key}">${n}</button>`}).join('')}</div>`}

function wireRoom(){
$$('[data-room]').forEach(b=>b.onclick=()=>switchRoom(b.dataset.room));$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));$$('[data-date]').forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;render()});$$('[data-food]').forEach(b=>b.onclick=()=>{let arr=b.dataset.food==='1'?data.food1:data.food2;let v=b.dataset.value;arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];if(b.dataset.food==='1')data.food1=arr;else data.food2=arr;save();render()});$$('[data-mood]').forEach(b=>b.onclick=()=>{if(b.dataset.mood==='1')data.mood1=b.dataset.value;else data.mood2=b.dataset.value;save();render()});$$('[data-season]').forEach(b=>b.onclick=()=>{data.season=b.dataset.season;save();render()});$$('[data-time]').forEach(b=>b.onclick=()=>{data.timeMode=b.dataset.time;save();render()});let f=$('#memoryPhoto');if(f)f.onchange=()=>$('#photoCount').textContent=`${f.files.length}枚選択中（1枚あたり約1MB以下推奨）`;let ci=$('#chatInput');if(ci){ci.oninput=()=>$('#typingHint').textContent=ci.value?'入力中…':'ふたりの会話がここに増えていくよ。';ci.onkeydown=e=>{if(e.key==='Enter')action('send-chat')}}let imp=$('#importData');if(imp)imp.onchange=async()=>{try{data={...defaults,...JSON.parse(await imp.files[0].text())};save();render();toast('バックアップを読み込みました')}catch{toast('ファイルを読み込めませんでした')}}}
async function action(a,id){if(a==='goto-calendar'){switchRoom('library');return}if(a==='month-prev'||a==='month-next'){let d=new Date(selectedDate+'T12:00:00');d.setMonth(d.getMonth()+(a==='month-prev'?-1:1));selectedDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;render();return}if(a==='save-memory'){let title=$('#memoryTitle').value.trim(),text=$('#memoryText').value.trim(),files=[...($('#memoryPhoto')?.files||[])];if(!title&&!text&&!files.length){toast('タイトル・本文・写真のどれかを入れてね');return}if(files.length>4){toast('一度に選べる写真は4枚までだよ');return}let photo='';if(files[0]){if(files[0].size>2*1024*1024){toast('写真が大きいみたい。2MB以下の写真を選んでね');return}photo=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(files[0])})}data.memories.push({id:Date.now(),date:selectedDate,title,text,photo});save();render();toast('思い出を星の図書館にしまったよ ✨');return}if(a==='delete-memory'){data.memories=data.memories.filter(m=>String(m.id)!==id);save();render();return}if(a==='save-letter'){let title=$('#letterTitle').value.trim()||'小さな手紙',body=$('#letterBody').value.trim();if(!body){toast('手紙の本文を書いてね');return}let to=$('#letterTo').value,letterDate=$('#letterDate').value||selectedDate;data.letters.push({id:Date.now(),title,body,to,date:selectedDate,futureDate:to==='future'?letterDate:'',read:false});save();render();if(to==='both'){letterPending=true;$('#creature').classList.remove('hide');toast('小さな動物が手紙を届けに来たよ！ 💌')}else toast('未来への手紙を大切にしまったよ 🌟');return}if(a==='check-letter'){let l=data.letters.find(x=>x.to==='both'&&!x.read);if(l){letterPending=true;$('#creature').classList.remove('hide')}else toast('今は届いている手紙はないみたい。またのお楽しみ！');return}if(a==='save-food1'||a==='save-food2'){save();toast('今日の気分を保存したよ 🍲');return}if(a==='save-requests'){data.requests=$('#requests').value;save();toast('ふたりへのメモを保存したよ ♡');return}if(a==='send-chat'){let inp=$('#chatInput'),v=inp.value.trim();if(!v)return;data.chat.push({who:'me',text:v,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});save();render();let log=$('#chatlog');log.scrollTop=log.scrollHeight;return}if(a==='save-annex'){let title=$('#annexTitle').value.trim(),body=$('#annexBody').value.trim();if(!title&&!body){toast('秘密のタイトルか内容を書いてね');return}data.annex.unshift({id:Date.now(),title,body,date:$('#annexDate').value,kind:$('#annexKind').value,reveal:$('#annexReveal').checked});save();render();toast('秘密の棚にしまったよ 🔐');return}if(a==='delete-annex'){data.annex=data.annex.filter(x=>String(x.id)!==id);save();render();return}if(a==='save-profile'){['name1','name2','started','anniversary','password'].forEach(k=>{let el=$('#'+k);if(el&&el.value.trim())data[k]=el.value.trim()});save();render();toast('家の設定を保存したよ');return}if(a==='export-data'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='our-little-home-backup.json';link.click();URL.revokeObjectURL(url);toast('バックアップを作成したよ');return}if(a==='lock'){data.unlocked=false;save();$('#entry').classList.remove('hide');$('#doorPassword').value='';return}}
$('#openDoor').onclick=()=>{if($('#doorPassword').value!==data.password){toast('合言葉が違うみたい。もう一度試してね');return}$('#doorArt').classList.add('open');setTimeout(()=>{$('#entry').classList.add('hide');$('#doorArt').classList.remove('open');data.unlocked=true;save();render()},700)};$('#settingsOpen').onclick=()=>switchRoom('settings');$('#seasonQuick').onclick=()=>switchRoom('settings');$('#openLetter').onclick=()=>{let l=data.letters.find(x=>x.to==='both'&&!x.read);$('#creature').classList.add('hide');if(l){l.read=true;save();switchRoom('library');selectedDate=l.date;render();toast('手紙を開いたよ。大切に読んでね 💌')}else toast('手紙はまだないみたい')};$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-room]');if(b)switchRoom(b.dataset.room)});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
